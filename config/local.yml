# Defaults for ./run-local. Every key can be overridden by a flag; see
# ./run-local -h.
#
# The same file is handed to the endpoint as DEBUG_FEEDBACK_CONFIG, so it
# also takes the endpoint's own keys (max_body, max_report, sites, ...
# see lib/debug_feedback/config.rb). Keys neither side knows are ignored.

# Where reports are written. A relative path resolves against this
# directory, which is where run-local puts the process.
store: store

# Listened on unless -s asks for a unix socket instead.
port: 9393

# Serve the test fixture page and the client alongside the endpoint, so
# the widget can be driven in a real browser.
fixture: false

# Deliberately no `sites` allowlist: locally, any site value is accepted.
# In production that key is what stops the endpoint being free storage.
