<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="build" content="test-build-1">
<title>Fixture</title>
<link rel="stylesheet" href="/fixture.css">
</head>
<body>
<h1>Fixture page</h1>

<section id="gallery">
    <figure>
        <img src="/missing-on-purpose.png" alt="A photograph that fails to load">
        <figcaption class="caption">Venetian carnival, 2019</figcaption>
    </figure>
</section>

<!-- The shape that broke on a live gallery page: a card whose whole
     body, heading and prose included, is wrapped in a link. Text there
     drags before it selects, and a click navigates away. -->
<ul class="index-simplex">
    <li><a href="/nowhere/"><div class="content">
        <h3>Retro</h3>
        <p>Traveling back in time, you can do it.</p>
    </div></a></li>
</ul>

<div class="too-wide"></div>

<form>
    <label>Secret <input type="password" name="secret" value="hunter2"></label>
    <label>Name <input type="text" name="name" value="Stephane"></label>
</form>

<!-- Two secrets a querySelectorAll on the document cannot see: one
     behind a shadow boundary, one behind a frame border. Both are the
     shapes a real site has (a component, an embedded form), and the
     redaction count is what proves the masking went through them. -->
<secret-box></secret-box>
<iframe src="/embedded.html" title="An embedded form"
        width="300" height="80" style="border: 1px solid #ccc"></iframe>

<!-- A colour this page states in oklch and nothing here can state in
     bytes. Last, so nothing above it moves. -->
<p class="oklch-probe">Mid grey on white, in oklch</p>

<script>
class SecretBox extends HTMLElement {
    connectedCallback() {
        // open, deliberately: a closed root cannot be reached at all,
        // and DESIGN 6.2 says so rather than pretending otherwise.
        this.attachShadow({ mode: "open" }).innerHTML =
            '<label>Token <input type="text" name="token" value="s3cr3t"></label>';
    }
}
customElements.define("secret-box", SecretBox);
</script>

<script src="/.corrigenda/corrigenda.js"
        data-endpoint="/report/" data-site="fixture.test" defer></script>
</body>
</html>
