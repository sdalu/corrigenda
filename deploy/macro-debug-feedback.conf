# -*- apache -*-
#
# DebugFeedback endpoint. See ../DEBUG-FEEDBACK.md §4.
#
# Install into Includes/ as macro-debug-feedback.conf.proposed first: httpd.conf
# includes Includes/*.conf, so the suffix parks the file where it can be
# read and checked without being loaded.

<Macro DebugFeedbackAuth>
    AuthName            "Debug feedback"
    AuthType            basic
    AuthBasicProvider   ldap
    AuthLDAPURL         ldap://127.0.0.1/ou=People,dc=sdalu,dc=com?uid,mail,cn?sub?(objectClass=inetOrgPerson)

    # Everything but OPTIONS. A CORS preflight is sent by the browser
    # with no credentials and no way to add any, so demanding them turns
    # every cross-origin report into a 401 the page never sees the cause
    # of. Nothing is exposed by letting it through: a preflight carries
    # no body and its answer is a set of Access-Control headers the app
    # only sends for origins it recognises.
    #
    # Authentication itself is not conditional -- with no Require in
    # force for OPTIONS, 2.4 simply asks for nothing.
    <LimitExcept OPTIONS>
        Require         valid-user
    </LimitExcept>
</Macro>

# Auth lives INSIDE this macro on purpose: a vhost opts in with one
# `Use DebugFeedbackEndpoint` and cannot mount the endpoint unauthenticated by
# forgetting a second line.
<Macro DebugFeedbackEndpoint>
    <Location /.debug-feedback>
        Use DebugFeedbackAuth

        # REMOTE_USER is a server variable, not a header, so it does not
        # cross a proxy hop. `set` (not `add`) overwrites whatever the
        # client sent, which is what makes it trustworthy on the far side.
        RequestHeader set X-Remote-User "expr=%{REMOTE_USER}"

        # This Location is stripped before proxying, so the app cannot
        # know the path it is served under; without this every link in
        # the review UI points one level too high.
        RequestHeader set X-Forwarded-Prefix "/.debug-feedback"

        # Unix socket, as kuiristo.eu and www.sdalu.com already do here.
        # /var/run rather than their /tmp: /tmp is world-writable, and a
        # socket there can be raced by any local user before the service
        # binds it.
        ProxyPass        unix:/var/run/debug-feedback/debug-feedback.sock|http://127.0.0.1/
        ProxyPassReverse unix:/var/run/debug-feedback/debug-feedback.sock|http://127.0.0.1/
    </Location>

    # The widget itself, and only the widget. Every page that injects it
    # fetches it — visitors included, who have no account and no reason
    # to be asked for one — so this one path is public. It is a static
    # script that was served from /common/js without authentication for
    # months; what is staff-only is the endpoint that RECEIVES reports
    # and the pages that read them, and those stay behind the Location
    # above.
    #
    # After it, not before: a longer Location wins, and merging is in
    # order of appearance.
    <Location /.debug-feedback/debug-feedback.js>
        AuthType None
        Require all granted

        # A vhost that sets `ExpiresByType application/javascript` for
        # its own scripts appends a second max-age to this one, and a
        # header reading "max-age=300, max-age=604800" is a header no
        # two caches need agree on. mod_expires is turned off for this
        # one URL so the service's own answer is the only answer.
        ExpiresActive Off
    </Location>
</Macro>
